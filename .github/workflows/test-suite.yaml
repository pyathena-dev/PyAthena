name: Test Suite

on:
  workflow_call:
    inputs:
      test-type:
        required: true
        type: string
      python-versions:
        description: JSON array of the Python versions to test
        required: true
        type: string

jobs:
  run:
    # External fork contributions must validate AWS behavior in their own account.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      TEST_TYPE: ${{ inputs.test-type }}
      AWS_DEFAULT_REGION: us-west-2
      AWS_ATHENA_S3_STAGING_DIR: s3://laughingman7743-pyathena/github/
      AWS_ATHENA_WORKGROUP: pyathena
      AWS_ATHENA_SPARK_WORKGROUP: pyathena-spark
      AWS_ATHENA_MANAGED_WORKGROUP: pyathena-managed
      # The SQLAlchemy S3 Tables tests need a fixed namespace, which the test
      # account no longer provides (master creates one per test session), so
      # they are skipped on this branch.
      AWS_ATHENA_S3_TABLES_CATALOG: s3tablescatalog/laughingman7743-pyathena-s3-tables

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # TODO: In the case of Python 3.13+, the following error occurs, so install Python using setup-python.
      #   ../meson.build:44:2: ERROR: Problem encountered: Cannot compile
      #   `Python.h`. Perhaps you need to install python-dev|python-devel
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
        if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: just
      - run: |
          just tool

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::676287850544:role/github-actions-oidc-pyathena
          role-session-name: PyAthenaTestSession
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Test
        run: |
          just tox
