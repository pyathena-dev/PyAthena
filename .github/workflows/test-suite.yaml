name: Test Suite

on:
  workflow_call:
    inputs:
      test-type:
        required: true
        type: string
      max-parallel:
        description: Maximum number of Python versions tested concurrently
        type: number
        default: 5
      skip-spark:
        description: Skip the Spark tests of the PyAthena suite
        type: boolean
        default: false

jobs:
  run:
    # External fork contributions must validate AWS behavior in their own account.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      TEST_TYPE: ${{ inputs.test-type }}
      PYTEST_ADDOPTS: ${{ inputs.skip-spark && '--ignore=tests/pyathena/spark --ignore=tests/pyathena/aio/spark' || '' }}
      AWS_DEFAULT_REGION: us-west-2
      # Keep SDK retries bounded; PyAthena also retries wrapped catalog errors.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
      AWS_ATHENA_S3_STAGING_DIR: s3://laughingman7743-pyathena/github/
      AWS_ATHENA_WORKGROUP: pyathena
      AWS_ATHENA_SPARK_WORKGROUP: pyathena-spark
      AWS_ATHENA_MANAGED_WORKGROUP: pyathena-managed
      # Registered S3 Tables catalog (s3tablescatalog/<table-bucket>) for the S3
      # Tables tests; each test session creates and deletes its own namespace.
      # The table bucket and the AWS analytics-services integration are
      # provisioned out of band.
      AWS_ATHENA_S3_TABLES_CATALOG: s3tablescatalog/laughingman7743-pyathena-s3-tables

    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # TODO: In the case of Python 3.13+, the following error occurs, so install Python using setup-python.
      #   ../meson.build:44:2: ERROR: Problem encountered: Cannot compile
      #   `Python.h`. Perhaps you need to install python-dev|python-devel
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
        if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: just
      - run: |
          just tool

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::676287850544:role/github-actions-oidc-pyathena
          role-session-name: PyAthenaTestSession
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Test
        run: |
          just tox
