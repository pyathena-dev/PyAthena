name: Trigger Docs on Release

# Rebuilds the documentation after the Release workflow succeeds, so a tag it
# refuses to publish does not trigger a documentation build.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write

jobs:
  trigger-docs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yaml',
              ref: 'master'
            })
