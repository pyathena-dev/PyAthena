name: Sweep test databases

on:
  schedule:
    - cron:  '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview eligible databases without deleting them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: database-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # Scheduled runs use the default branch; manual dispatch must choose it.
    if: github.repository == 'pyathena-dev/PyAthena' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-west-2
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
      # Sweep the S3 Tables namespaces test sessions leave in this table bucket.
      AWS_ATHENA_S3_TABLES_CATALOG: s3tablescatalog/laughingman7743-pyathena-s3-tables
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::676287850544:role/github-actions-oidc-pyathena
          role-session-name: PyAthenaDatabaseSweep
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Sweep expired test databases
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            uv run --locked --no-dev python scripts/sweep_databases.py
          else
            uv run --locked --no-dev python scripts/sweep_databases.py --apply
          fi
