name: Sweep test databases

on:
  workflow_run:
    workflows: [Test]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview eligible databases without deleting them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: database-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # A separate completion workflow also runs after failed or cancelled tests.
    if: >-
      github.repository == 'pyathena-dev/PyAthena' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-west-2
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}

    steps:
      # Never execute code or consume artifacts from the triggering test run.
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::676287850544:role/github-actions-oidc-pyathena
          role-session-name: PyAthenaDatabaseSweep
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Sweep expired test databases
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            uv run --locked --no-dev python scripts/sweep_databases.py
          else
            uv run --locked --no-dev python scripts/sweep_databases.py --apply
          fi
