[project]
name = "pyathena-benchmarks"
version = "0.1.0"
description = "Reproducible Athena cursor measurements"
# The workspace lock covers the root's Python range; benchmark runs use Python 3.12.
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "PyAthena[pandas,arrow,polars,sqlalchemy]",
    # Released awswrangler caps pyarrow below 26.0.0, the first release with
    # Python 3.15 wheels; the marker keeps the workspace lock installable on 3.15.
    "awswrangler>=3.17,<4; python_version < '3.15'",
    "polars",
    "psutil>=7,<8",
]

[tool.uv]
package = false
default-groups = ["test", "polars1"]

[tool.uv.sources]
pyathena = { workspace = true }

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=1", "mypy", "types-psutil", "cfn-lint>=1"]
polars1 = ["polars>=1.39.0,<2"]
polars2 = ["polars>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
extend = "../pyproject.toml"
exclude = [".venv", ".venv-*"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["pyathena_bench"]
