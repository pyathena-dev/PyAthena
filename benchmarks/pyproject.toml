[project]
name = "pyathena-benchmarks"
version = "0.1.0"
description = "Reproducible Athena cursor measurements"
# The workspace lock covers the root's Python range; benchmark runs use Python 3.12.
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "PyAthena[pandas,arrow,polars]",
    "awswrangler>=3.17,<4",
    "polars",
    "psutil>=7,<8",
]

[tool.uv]
package = false

[tool.uv.sources]
pyathena = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "mypy", "types-psutil", "cfn-lint>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
extend = "../pyproject.toml"
exclude = [".venv"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["pyathena_bench"]
