[aws]
region = "us-west-2"
workgroup = "pyathena"
# Leave profile unset to use AWS_PROFILE locally or the instance role on EC2.

[source]
database = "pyathena_benchmark"
table = "pypi_file_downloads"
download_date = "2026-09-17"

[scales]
small = 10000
medium = 100000
large = 1000000
xlarge = 10000000

[measurement]
warmups = 1
repetitions = 5
arraysizes = [100, 1000]
chunksizes = [10000, 100000]
concurrency = [1, 10, 50, 100]
executor_workers = 32
poll_interval = 1.0
sample_interval = 0.05
heartbeat_interval = 0.01
timeout_seconds = 3600.0
memory_fraction = 0.8

[filesystem]
# Object sizes in bytes of the filesystem suite, by scale name; copies run only over 5 GiB.
sizes = { small = 67108864, medium = 268435456, large = 1073741824, xlarge = 6442450944 }
block_size = 8388608
max_workers = [8, 40]
pool_connections = [10, 40]

[objects]
# Object counts of the objects suite, by scale name; each object has `size` bytes, and
# the listing set of a scale has `listing_keys_per_object` keys per object.
counts = { small = 100, medium = 1000, large = 10000 }
size = 1048576
listing_keys_per_object = 100
concurrency = [8, 40]
