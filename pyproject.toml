"pyathena/spark/cursor.py" = ["D100", "D102"]
"pyathena/sqlalchemy/__init__.py" = ["D104"]
"pyathena/sqlalchemy/array.py" = ["D107"]
"pyathena/sqlalchemy/arrow.py" = ["D100"]
"pyathena/sqlalchemy/base.py" = ["D100", "D107"]
"pyathena/sqlalchemy/map.py" = ["D107"]
"pyathena/sqlalchemy/pandas.py" = ["D100"]
"pyathena/sqlalchemy/polars.py" = ["D100"]
"pyathena/sqlalchemy/preparer.py" = ["D100", "D107"]
"pyathena/sqlalchemy/requirements.py" = ["D100"]
"pyathena/sqlalchemy/rest.py" = ["D100"]
"pyathena/sqlalchemy/s3fs.py" = ["D100"]
"pyathena/sqlalchemy/struct.py" = ["D107"]
"pyathena/util.py" = ["D100", "D107"]

[tool.mypy]
follow_imports = "silent"
disallow_any_generics = true
strict_optional = true
check_untyped_defs = true
allow_redefinition = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
# Overrides are marked with pyathena.util.override (PEP 698).
enable_error_code = ["explicit-override"]
exclude = [
    "benchmarks.*",
    "tests.*",
    ".venv.*",
    ".tox.*",
    "docs.*",
]

[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = true
envlist = py{311,312,313,314}-{pyathena,sqla,sqla_async}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
TEST_TYPE =
    pyathena: pyathena
    sqla: sqla
    sqla_async: sqla_async

[testenv]
allowlist_externals =
    uv
    uvx
    just
commands =
    uv sync --group dev
    pyathena: just test pyathena
    sqla: just test sqla
    sqla_async: just test sqla-async
passenv =
    TOXENV
    PYTEST_ADDOPTS
    AWS_*
    GITHUB_*
"""
