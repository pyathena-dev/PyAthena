"pyathena/arrow/converter.py" = ["D100", "D107"]
"pyathena/arrow/cursor.py" = ["D100"]
"pyathena/arrow/result_set.py" = ["D100", "D102", "D107"]
"pyathena/async_cursor.py" = ["D100", "D102", "D107"]
"pyathena/common.py" = ["D100", "D102", "D107"]
"pyathena/connection.py" = ["D100"]
"pyathena/converter.py" = ["D100", "D102", "D107"]
"pyathena/cursor.py" = ["D100", "D107"]
"pyathena/error.py" = ["D100"]
