[project]
name = "PyAthena"
description = "Python DB API 2.0 (PEP 249) client for Amazon Athena"
authors = [
    {name = "The PyAthena authors"},
]
maintainers = [
    {name = "laughingman7743", email = "laughingman7743@gmail.com"},
]
dependencies = [
    "boto3>=1.41.2",
    "botocore>=1.41.2",
    "tenacity>=4.1.0",
    "fsspec",
    "python-dateutil",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Database :: Front-Ends",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/pyathena-dev/PyAthena/"
repository = "https://github.com/pyathena-dev/PyAthena/"
documentation = "https://pyathena.dev/"
issues = "https://github.com/pyathena-dev/PyAthena/issues"

[project.entry-points."sqlalchemy.dialects"]
awsathena = "pyathena.sqlalchemy.rest:AthenaRestDialect"
"awsathena.rest" = "pyathena.sqlalchemy.rest:AthenaRestDialect"
"awsathena.pandas" = "pyathena.sqlalchemy.pandas:AthenaPandasDialect"
"awsathena.arrow" = "pyathena.sqlalchemy.arrow:AthenaArrowDialect"
"awsathena.polars" = "pyathena.sqlalchemy.polars:AthenaPolarsDialect"
"awsathena.s3fs" = "pyathena.sqlalchemy.s3fs:AthenaS3FSDialect"
"awsathena.aiorest" = "pyathena.aio.sqlalchemy.rest:AthenaAioRestDialect"
"awsathena.aiopandas" = "pyathena.aio.sqlalchemy.pandas:AthenaAioPandasDialect"
"awsathena.aioarrow" = "pyathena.aio.sqlalchemy.arrow:AthenaAioArrowDialect"
"awsathena.aiopolars" = "pyathena.aio.sqlalchemy.polars:AthenaAioPolarsDialect"
"awsathena.aios3fs" = "pyathena.aio.sqlalchemy.s3fs:AthenaAioS3FSDialect"

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.0"]
aiosqlalchemy = [
    "sqlalchemy[asyncio]>=2.0.0",
]
pandas = [
    "pandas>=3.0.0",
]
arrow = [
    "pyarrow>=22.0.0",
]
polars = [
    "polars>=1.39.0",
]

[dependency-groups]
dev = [
    "sqlalchemy[asyncio]>=2.0.0",
    "pandas>=3.0.0",
    "pyarrow>=22.0.0",
    "polars>=1.39.0",
    "Jinja2>=3.1.0",
    "mypy>=0.900",
    "pytest>=3.5",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-dependency",
    "pytest-rerunfailures",
    "sphinx",
    "sphinx-multiversion",
    "sphinxext-opengraph",
    "furo",
    "myst-parser",
    "sphinx-design",
    "types-python-dateutil",
    "cfn-lint>=1",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "pyathena/",
    "LICENSE",
    "pyproject.toml",
    "README.md"
]

[tool.hatch.build.targets.wheel]
packages = ["pyathena"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pyathena/_version.py"

[tool.uv.workspace]
members = ["benchmarks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [
    "benchmarks",
    ".venv",
    ".tox",
    "docs.*",
]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    ".tox",
    "benchmarks",
]
target-version = "py311"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "UP",  # pyupgrade
    "PIE",  # flake8-pie
    "PERF",  # perflint
    "T20",  # flake8-print
    "FLY",  # flynt
    "ISC",  # flake8-implicit-str-concat
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "PGH",  # pygrep-hooks
    "G",  # flake8-logging-format
    "PT",  # flake8-pytest-style
    "D",  # pydocstyle
]
ignore = [
    "RUF059",  # unused-unpacked-variable (too noisy for interface-heavy code)
    "G004",  # logging-f-string (f-strings are preferred for log messages)
    "D105",  # undocumented-magic-method (protocol methods need no docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
# Overrides marked with @override inherit the base method's documentation.
ignore-decorators = ["pyathena.util.override"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "RUF012",  # mutable-class-default (test classes often use mutable defaults)
]
"!pyathena/**" = [
    "D",  # docstring rules apply to the package only
]
"pyathena/sqlalchemy/compiler.py" = [
    "N802",  # SQLAlchemy TypeCompiler requires visit_UPPERCASE method names
    # Missing docstrings (#882)
    "D100",
    "D102",
    "D107",
]
"pyathena/aio/sqlalchemy/base.py" = [
    "N801",  # SQLAlchemy async adapter naming convention (AsyncAdapt_*)
    # Missing docstrings (#882)
    "D100",
    "D102",
    "D107",
]
# Missing docstrings (#882). Remove an entry once its file is documented.
"pyathena/__init__.py" = ["D104"]
"pyathena/aio/__init__.py" = ["D104"]
"pyathena/aio/arrow/__init__.py" = ["D104"]
"pyathena/aio/arrow/cursor.py" = ["D100", "D107"]
"pyathena/aio/common.py" = ["D100"]
"pyathena/aio/connection.py" = ["D100", "D107"]
"pyathena/aio/cursor.py" = ["D100", "D107"]
