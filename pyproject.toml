"pyathena/aio/pandas/cursor.py" = ["D100", "D107"]
"pyathena/aio/polars/__init__.py" = ["D104"]
"pyathena/aio/polars/cursor.py" = ["D100", "D107"]
"pyathena/aio/result_set.py" = ["D100", "D107"]
"pyathena/aio/s3fs/__init__.py" = ["D104"]
"pyathena/aio/s3fs/cursor.py" = ["D100", "D107"]
