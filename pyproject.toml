"pyathena/glue.py" = ["D107"]
"pyathena/model.py" = ["D100", "D102", "D107"]
"pyathena/options.py" = ["D100"]
"pyathena/pandas/__init__.py" = ["D104"]
"pyathena/pandas/async_cursor.py" = ["D100", "D107"]
"pyathena/pandas/converter.py" = ["D100", "D107"]
"pyathena/pandas/cursor.py" = ["D100"]
