"pyathena/pandas/result_set.py" = ["D100", "D102"]
"pyathena/pandas/util.py" = ["D100"]
"pyathena/parser.py" = ["D100", "D107"]
"pyathena/polars/__init__.py" = ["D104"]
"pyathena/polars/async_cursor.py" = ["D100"]
"pyathena/polars/converter.py" = ["D100", "D107"]
"pyathena/polars/cursor.py" = ["D100"]
"pyathena/polars/result_set.py" = ["D100"]
"pyathena/result_set.py" = ["D100", "D102", "D107"]
"pyathena/s3fs/__init__.py" = ["D104"]
"pyathena/s3fs/async_cursor.py" = ["D100"]
"pyathena/s3fs/converter.py" = ["D100", "D107"]
"pyathena/s3fs/cursor.py" = ["D100"]
