# https://rumdl.dev/

[global]
# A leading "/" anchors a pattern to the repository root; "*.md" alone would
# also match Markdown files in every subdirectory.
include = [
    "docs/**/*.md",
    "benchmarks/*.md",
    "scripts/**/*.md",
    "cloudformation/**/*.md",
    "/*.md",
]
# Run the rule set of markdownlint 0.38 (used by markdownlint-cli2 0.18.1,
# the previous linter) instead of every rule rumdl enables by default.
enable = [
    "MD001", "MD003", "MD004", "MD005", "MD007", "MD009", "MD010", "MD011",
    "MD012", "MD018", "MD019", "MD020", "MD021", "MD022", "MD023", "MD024",
    "MD025", "MD026", "MD027", "MD028", "MD029", "MD030", "MD031", "MD032",
    "MD033", "MD034", "MD035", "MD036", "MD037", "MD038", "MD039", "MD040",
    "MD042", "MD043", "MD044", "MD045", "MD046", "MD047", "MD048", "MD049",
    "MD050", "MD051", "MD052", "MD053", "MD054", "MD055", "MD056", "MD058",
    "MD059",
    # Not enabled:
    # MD013: docs have long URLs and code lines that would be awkward to wrap
    # MD014: `$ command` style is intentional in docs/testing.md and README shell snippets
    # MD041: MyST `(label)=` ref targets must come before the first heading, so the
    #        first line of many docs/*.md files is not an H1
]

# Sphinx renders docs/ with MyST, so directive fences such as ```{toctree}
# are not code blocks without a language
[per-file-flavor]
"docs/**/*.md" = "myst"

# Match existing style: dash bullets, 2-space nested indent
[MD004]
style = "dash"

[MD007]
indent = 2
style = "fixed"

# Cursor docs intentionally repeat subsection names ("Basic usage") under different cursors
[MD024]
siblings-only = true

# Allow inline HTML used by README (centered images) and MyST admonitions
[MD033]
allowed-elements = ["details", "summary", "br", "kbd", "sub", "sup", "div", "img", "p", "a"]

# Options whose rumdl defaults differ from markdownlint's
[MD001]
front-matter-title = false

[MD010]
code-blocks = true
spaces-per-tab = 1

[MD026]
punctuation = ".,;:!。，；：！"

[MD027]
list-items = true

[MD036]
punctuation = ".,;:!?。，；：！？"

[MD051]
ignore-case = false

[MD052]
ignore = ["x"]

[MD053]
ignored-definitions = ["//"]
